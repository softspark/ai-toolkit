# Developer tooling only (see requirements-dev.txt). Not shipped.
# Allowlist ratchet: `files` names the modules that pass --strict. Add a file
# when it passes, never remove one. Imports of unlisted modules are resolved
# for types but not reported (follow_imports = silent), or every unlisted
# module would fail the gate.
[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
follow_imports = silent
files =
    scripts/frontmatter.py,
    scripts/install_steps/skill_scope.py
