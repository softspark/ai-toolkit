# Developer tooling only (see requirements-dev.txt). Not shipped.
# Allowlist ratchet: `files` names the modules that pass --strict. Add a file
# when it passes, never remove one. Imports of unlisted modules are resolved
# for types but not reported (follow_imports = silent), or every unlisted
# module would fail the gate.
[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
follow_imports = silent
files =
    app/hooks/_prompt-intent.py,
    scripts/frontmatter.py,
    scripts/prompt_surfaces.py,
    scripts/claude_codex_capability.py,
    scripts/claude_switch.py,
    scripts/claude_usage.py,
    scripts/account_profiles.py,
    scripts/account_status.py,
    scripts/codex_switch.py,
    scripts/codex_usage.py,
    scripts/llm_status.py,
    scripts/install_steps/skill_scope.py,
    scripts/registered_rules.py,
    scripts/secret_column_check.py,
    benchmarks/token_usage/transcript.py,
    benchmarks/token_usage/survey.py,
    benchmarks/token_usage/attribute.py,
    benchmarks/token_usage/simulate.py,
    benchmarks/token_usage/decompose.py,
    benchmarks/token_usage/replay_rtk.py,
    benchmarks/token_usage/replay_rtk_runner.py
