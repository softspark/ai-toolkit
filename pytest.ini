# Developer tooling only (see requirements-dev.txt). Not shipped: package.json
# "files" excludes it, and the runtime scripts stay stdlib-only.
#
# Deliberately not a pyproject.toml: this is an npm-first repository, and the
# toolkit's own Stop hook (quality-gate.sh) reads a pyproject.toml as "Python
# project, run ruff over everything". Ruff's rule set for this repo is the
# package.json `lint:py` script.
[pytest]
testpaths = tests/python
addopts = -q
