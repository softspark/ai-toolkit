name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  shellcheck:
    name: ShellCheck hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on hooks
        run: shellcheck --severity=warning app/hooks/*.sh app/plugins/*/hooks/*.sh

  python-syntax:
    name: Python ${{ matrix.python-version }} syntax + import check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the declared floor (PYTHON_MIN in bin/ai-toolkit.js and
        # scripts/_common.py); 3.13 guards against the opposite drift.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python scripts
        run: python3 -m py_compile scripts/*.py app/skills/*/scripts/*.py

      # py_compile only catches syntax. Version-gated *runtime* features
      # (dataclass slots=, tomllib, ...) surface only on import, which is how
      # a 3.10-only construct reached users on macOS system Python 3.9.
      - name: Import every scripts/ module
        run: |
          python3 - <<'PY'
          import importlib, pathlib, sys, traceback
          root = pathlib.Path("scripts")
          sys.path[:0] = [str(root), str(root / "install_steps")]
          failed = []
          for path in sorted(root.rglob("*.py")):
              if "__pycache__" in path.parts:
                  continue
              module = ".".join(path.relative_to(root).with_suffix("").parts)
              try:
                  importlib.import_module(module)
              except Exception:
                  failed.append(module)
                  print(f"::error::{module} failed to import on Python {sys.version.split()[0]}")
                  traceback.print_exc()
          sys.exit(1 if failed else 0)
          PY

  validate:
    name: Validate toolkit integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run validate.py
        run: python3 scripts/validate.py --strict

      - name: Run evaluate_skills.py
        run: python3 scripts/evaluate_skills.py

  test:
    name: Bats test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install bats-core + parallel (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats parallel

      - name: Install bats-core + parallel (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core parallel

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run tests
        run: bats tests/ --jobs 4 --no-parallelize-within-files

  required-files:
    name: Required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Every file the module template requires is present
        run: |
          for f in LICENSE NOTICE CHANGELOG.md SECURITY.md CODE_OF_CONDUCT.md \
                   README.md CLAUDE.md .gitignore .npmignore .npmrc \
                   .github/CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md \
                   .github/CODEOWNERS .github/FUNDING.yml .github/dependabot.yml \
                   .github/ISSUE_TEMPLATE/bug_report.md \
                   .github/ISSUE_TEMPLATE/feature_request.md \
                   .github/ISSUE_TEMPLATE/config.yml \
                   kb/procedures/sop-pre-commit.md \
                   kb/procedures/sop-release.md \
                   kb/procedures/sop-post-release-testing.md; do
            test -f "$f" || { echo "::error::Missing: $f"; exit 1; }
          done
      - name: Version is in sync across every manifest
        run: |
          PKG=$(node -p "require('./package.json').version")
          for f in manifest.json package-lock.json app/.claude-plugin/plugin.json; do
            V=$(node -p "require('./$f').version")
            test "$V" = "$PKG" || { echo "::error::$f is $V, package.json is $PKG"; exit 1; }
          done
          grep -q "## v${PKG} " CHANGELOG.md \
            || { echo "::error::CHANGELOG has no entry for v${PKG}"; exit 1; }

  security-audit:
    name: Skill security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run audit_skills.py
        run: python3 scripts/audit_skills.py --ci
