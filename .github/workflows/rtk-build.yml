name: rtk cross-build

# Manual only. This never runs on push, and it never publishes unless the
# `publish` input is set explicitly. See kb/history/completed/rtk-pack-integration-20260726.md
# section 5.
on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream rtk tag to build from"
        required: true
        default: "v0.44.0"
      build_revision:
        description: "Our build revision for this upstream tag"
        required: true
        default: "1"
      rust_version:
        description: "Exact toolchain. Upstream uses unpinned stable with warnings=deny, which we refuse to inherit."
        required: true
        default: "1.91.0"
      publish:
        description: "Publish a GitHub Release with the artifacts"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  # RTK_TELEMETRY_URL and RTK_TELEMETRY_TOKEN are left undefined on purpose.
  # option_env! resolves them at compile time (telemetry.rs:16-17,
  # telemetry_cmd.rs:176,189); with neither defined the endpoint cannot be
  # re-enabled by any runtime env var or config.
  CARGO_TERM_COLOR: always

  # Advisory remediation applied to the pinned upstream lockfile. Both the
  # audit job and every build job apply this, so we audit exactly the
  # dependency set we ship. Cargo.toml is untouched: these are in-range
  # updates, so no source modification is involved.
  #   anyhow          1.0.102 -> 1.0.103   RUSTSEC-2026-0190 (unsound)
  #   crossbeam-epoch 0.9.18  -> 0.9.20    RUSTSEC-2026-0204
  RTK_CARGO_UPDATES: "anyhow crossbeam-epoch"

jobs:
  audit:
    name: cargo audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream rtk
        uses: actions/checkout@v6
        with:
          repository: rtk-ai/rtk
          ref: ${{ inputs.upstream_tag }}
          path: rtk-src

      - name: Install Rust ${{ inputs.rust_version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust_version }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Apply advisory remediation to the lockfile
        working-directory: rtk-src
        run: |
          set -eu
          read -ra crates <<< "$RTK_CARGO_UPDATES"
          for c in "${crates[@]}"; do cargo update -p "$c"; done
          git --no-pager diff --stat Cargo.lock

      # Upstream's own audit is advisory: ci.yml:88-96 swallows failures into a
      # warning. Rebuilding from a tag inherits that lockfile, so ours blocks.
      #
      # Two quick-xml advisories are ignored with reasons, not waved through:
      # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 are both fixed only in 0.41.0,
      # while rtk pins "0.37" as a direct dependency (Cargo.toml:34). Taking the
      # fix means editing Cargo.toml and the calling code in
      # src/cmds/dotnet/dotnet_trx.rs, which would break the promise that the
      # only difference from an upstream build is the undefined telemetry
      # endpoint. The reachable surface is narrow: quick-xml is used only to
      # parse .NET TRX test output (dotnet_trx.rs, dotnet_cmd.rs), the input is
      # a test report produced locally by the user's own run, and both
      # advisories are availability-only (CVSS C:N/I:N/A:H).
      # Revisit on every upstream sync: if rtk moves to quick-xml >= 0.41,
      # delete these two ignores rather than carrying them forward.
      - name: Audit the remediated lockfile
        working-directory: rtk-src
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 is the last x86_64 macOS image and GitHub is winding it
          # down; runs 30212577757 and 30214341444 both sat queued on it
          # indefinitely while every other target finished. Built on arm64
          # instead, as upstream does. Unlike upstream we still try to run the
          # artifact: verify_rtk_binary.py detects Rosetta 2 and executes it,
          # and reports `inconclusive` rather than `pass` if it cannot.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Static musl is our only x86_64 Linux artifact. It runs on glibc,
          # and upstream's own Homebrew formula routes Linux x86_64 here
          # (release.yml:314-316).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true

          # Native, and not negotiable: build.rs:6-13 emits
          # cargo:rustc-link-arg=/STACK:8388608 under #[cfg(windows)], which in
          # a build script is a HOST predicate. Cross-building from Linux
          # silently drops the 8 MiB stack reservation that upstream says is
          # what makes rtk.exe start reliably.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Check out ai-toolkit
        uses: actions/checkout@v6
        with:
          path: ai-toolkit

      - name: Check out upstream rtk ${{ inputs.upstream_tag }}
        uses: actions/checkout@v6
        with:
          repository: rtk-ai/rtk
          ref: ${{ inputs.upstream_tag }}
          path: rtk-src

      - name: Install Rust ${{ inputs.rust_version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust_version }}
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      # rusqlite `bundled` (Cargo.toml:26) is not switchable off, so this target
      # needs a target-capable C compiler for SQLite. Upstream sets only the
      # linker and lets the cc crate guess; we set CC and AR explicitly so a
      # runner image change fails loudly instead of producing an arch mismatch
      # at link time.
      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user-static
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            # The gnu target is dynamically linked, so qemu-user needs the
            # aarch64 sysroot to find /lib/ld-linux-aarch64.so.1. Without this
            # verification fails with exit 255 before the binary starts, which
            # is what happened on run 30212577757. verify_rtk_binary.py reads
            # this and passes it to qemu as `-L`, because the offline check runs
            # under sudo and sudo's env_reset would otherwise drop it (run
            # 30214341444).
            echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu"
          } >> "$GITHUB_ENV"

      - name: Assert the telemetry build gate (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -eu
          # Checked without indirect expansion so this behaves identically on
          # the macOS runners' bash 3.2.
          if [ -n "${RTK_TELEMETRY_URL:-}" ]; then
            echo "::error::RTK_TELEMETRY_URL is set; this build would compile in a telemetry endpoint"
            exit 1
          fi
          if [ -n "${RTK_TELEMETRY_TOKEN:-}" ]; then
            echo "::error::RTK_TELEMETRY_TOKEN is set; this build would compile in a telemetry token"
            exit 1
          fi
          echo "both telemetry build variables are undefined"
        shell: bash

      - name: Assert the telemetry build gate (Windows)
        if: runner.os == 'Windows'
        run: |
          foreach ($var in @('RTK_TELEMETRY_URL','RTK_TELEMETRY_TOKEN')) {
            $value = [Environment]::GetEnvironmentVariable($var)
            if (-not [string]::IsNullOrEmpty($value)) {
              Write-Output "::error::$var is set; this build would compile in a telemetry endpoint"
              exit 1
            }
          }
          Write-Output "both telemetry build variables are undefined"
        shell: pwsh

      # Must match the audit job exactly, or we would audit one dependency set
      # and ship another. `--locked` below still holds: Cargo.toml is unchanged,
      # so the updated lockfile stays consistent with it.
      - name: Apply advisory remediation to the lockfile
        working-directory: rtk-src
        run: |
          set -eu
          read -ra crates <<< "$RTK_CARGO_UPDATES"
          for c in "${crates[@]}"; do cargo update -p "$c"; done
          git --no-pager diff --stat Cargo.lock
        shell: bash

      # A clean target directory per build, because build.rs emits no
      # cargo:rerun-if-env-changed for the telemetry vars and relies on cargo's
      # automatic option_env! tracking.
      # /Brepro makes the MSVC linker derive its timestamp from the content
      # instead of the clock. Without it the Windows artifact differs by 24
      # bytes per link (the timestamp, repeated in the debug directory, plus a
      # CodeView GUID) while the other four targets are byte-identical across
      # runs. With it, "a changed digest means changed input" holds on all five,
      # which is what the sync SOP relies on.
      - name: Enable deterministic linking (Windows)
        if: runner.os == 'Windows'
        run: |
          "RUSTFLAGS=-C link-arg=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Build
        working-directory: rtk-src
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify the binary is silent (POSIX)
        if: runner.os != 'Windows'
        run: |
          python3 ai-toolkit/scripts/verify_rtk_binary.py \
            --binary "rtk-src/target/${{ matrix.target }}/release/rtk" \
            --target "${{ matrix.target }}" \
            --upstream-tag "${{ inputs.upstream_tag }}" \
            --out "verification-${{ matrix.target }}.json"
        shell: bash

      - name: Verify the binary is silent (Windows)
        if: runner.os == 'Windows'
        run: |
          python ai-toolkit/scripts/verify_rtk_binary.py `
            --binary "rtk-src/target/${{ matrix.target }}/release/rtk.exe" `
            --target "${{ matrix.target }}" `
            --upstream-tag "${{ inputs.upstream_tag }}" `
            --out "verification-${{ matrix.target }}.json"
        shell: pwsh

      - name: Collect Apache-2.0 obligations
        run: |
          cp rtk-src/LICENSE "LICENSE-rtk-${{ matrix.target }}"
        shell: bash

      - name: Package (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -eu
          tar -czf "rtk-${{ matrix.target }}.${{ matrix.archive }}" \
            -C "rtk-src/target/${{ matrix.target }}/release" rtk
        shell: bash

      # 7z stores whatever relative path it is given, so zipping the full path
      # buried rtk.exe under rtk-src/target/<triple>/release/ inside the
      # archive while every tar.gz held a bare `rtk` (run 30214882862). Push
      # into the release directory first so all five archives have one flat
      # entry and the pack installer can extract them the same way.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Push-Location "rtk-src/target/${{ matrix.target }}/release"
          7z a "$env:GITHUB_WORKSPACE/rtk-${{ matrix.target }}.${{ matrix.archive }}" rtk.exe
          Pop-Location
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-${{ matrix.target }}
          path: |
            rtk-${{ matrix.target }}.${{ matrix.archive }}
            verification-${{ matrix.target }}.json
            LICENSE-rtk-${{ matrix.target }}
          if-no-files-found: error

  collect:
    name: Checksums and verification summary
    needs: [audit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out ai-toolkit
        uses: actions/checkout@v6
        with:
          path: ai-toolkit

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name 'rtk-*.tar.gz' -o -name 'rtk-*.zip' \) \
            -exec cp {} release/ \;
          cp artifacts/*/LICENSE-rtk-* release/ 2>/dev/null || true
          cp "$(find artifacts -name 'LICENSE-rtk-*' | head -1)" release/LICENSE
          rm -f release/LICENSE-rtk-*
          cd release
          sha256sum rtk-*.tar.gz rtk-*.zip > checksums.txt
          cat checksums.txt

      # Every archive must hold exactly one flat entry. The pack installer
      # extracts all five the same way, so a nested path is a silent install
      # failure on one platform only. The Windows zip shipped like that on run
      # 30214882862 and nothing caught it.
      - name: Assert archive layout
        run: |
          set -eu
          fail=0
          for f in release/rtk-*.tar.gz; do
            entries=$(tar -tzf "$f")
            count=$(printf '%s\n' "$entries" | wc -l | tr -d ' ')
            if [ "$count" != "1" ] || [ "$entries" != "rtk" ]; then
              echo "::error::$f should contain exactly one entry named rtk, got: $entries"
              fail=1
            fi
          done
          for f in release/rtk-*.zip; do
            entries=$(unzip -Z1 "$f")
            count=$(printf '%s\n' "$entries" | wc -l | tr -d ' ')
            if [ "$count" != "1" ] || [ "$entries" != "rtk.exe" ]; then
              echo "::error::$f should contain exactly one entry named rtk.exe, got: $entries"
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "all archives hold a single flat binary"
          exit "$fail"

      # Upstream has no NOTICE file. Apache-2.0 section 4 lets us add one, and
      # it is where the single build-time difference is recorded.
      - name: Write NOTICE
        run: |
          cat > release/NOTICE <<EOF
          This distribution contains rtk (https://github.com/rtk-ai/rtk),
          licensed under the Apache License, Version 2.0. See LICENSE.

          Built from upstream tag ${{ inputs.upstream_tag }} by SoftSpark for
          @softspark/ai-toolkit, build revision ${{ inputs.build_revision }}.

          Two build-time differences from an upstream release build, and no
          source modifications:

          1. RTK_TELEMETRY_URL and RTK_TELEMETRY_TOKEN are left undefined, so
             the compile-time telemetry endpoint is absent and cannot be
             supplied at runtime.
          2. Cargo.lock carries in-range security updates for anyhow
             (RUSTSEC-2026-0190) and crossbeam-epoch (RUSTSEC-2026-0204).
             Cargo.toml is unchanged; no dependency requirement was altered.

          Upstream DISCLAIMER.md is deliberately not redistributed: it states
          that telemetry is collected by default, which is not true of this
          build.
          EOF
          cat release/NOTICE

      - name: Summarise verification
        run: |
          set -eu
          echo "## rtk ${{ inputs.upstream_tag }} verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| target | verdict | checks |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for f in $(find artifacts -name 'verification-*.json' | sort); do
            python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          checks = "; ".join(
              f"{k}={'ok' if v.get('pass') else ('skip' if v.get('pass') is None else 'FAIL')}"
              for k, v in d["checks"].items()
          )
          print(f"| {d['target']} | {d['verdict']} | {checks} |")
          PY
            verdict=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['verdict'])" "$f")
            target=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['target'])" "$f")
            case "$verdict" in
              pass) ;;
              # Every runtime assertion was skipped, so the artifact was never
              # started. Surfaced loudly rather than counted as green, but not
              # a build failure: it means this host could not run the target.
              inconclusive)
                echo "::warning::$target verified inconclusive; no runtime assertion executed" ;;
              *)
                echo "::error::$target failed verification"
                fail=1 ;;
            esac
          done
          exit "$fail"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: softspark-rtk-${{ inputs.upstream_tag }}-${{ inputs.build_revision }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: collect
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: softspark-rtk-${{ inputs.upstream_tag }}-${{ inputs.build_revision }}
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: softspark-rtk-${{ inputs.upstream_tag }}-${{ inputs.build_revision }}
        run: |
          set -eu
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "rtk ${{ inputs.upstream_tag }} built from source with the telemetry endpoint undefined. Apache-2.0; see LICENSE and NOTICE in the assets."
