name: Publish

# Tag push only. Every gate (validate, audits, ShellCheck, bats on macOS and
# Linux, Python floor) runs locally in scripts/release.sh before the tag
# exists; see kb/procedures/sop-release.md. This job builds and publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release
      id-token: write   # npm --provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@softspark'

      - name: Tag equals package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PKG_VERSION" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG_VERSION"; exit 1; }

      # Build, not a gate: AGENTS.md and the other generated files are
      # gitignored but ship in the tarball, so they are produced here.
      - name: Generate package assets
        run: |
          npm run generate:all
          test -s AGENTS.md

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 (node24 runtime)
        with:
          generate_release_notes: true
