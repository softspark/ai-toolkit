name: Publish

# Tag push only. Every gate (validate, audits, ShellCheck, bats on macOS and
# Linux, Python floor) runs locally in scripts/release.sh before the tag
# exists; see kb/procedures/sop-release.md. This job builds and publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release
      id-token: write   # npm --provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@softspark'

      - name: Tag equals package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PKG_VERSION" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG_VERSION"; exit 1; }

      # Build, not a gate: regenerates the package assets from the tagged tree.
      - name: Generate package assets
        run: npm run generate:all

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (node24 runtime)
        with:
          generate_release_notes: true
